[package]
name = "tpt-webrtc-codecs"
description = "Codec layer: VideoEncoder/VideoDecoder abstractions, AV1 (rav1e encode / dav1d decode), VP8/VP9, Opus; no H.264 by policy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["multimedia", "api-bindings", "asynchronous"]
keywords = ["webrtc", "codecs", "av1", "rav1e", "dav1d", "vp8", "vp9", "opus", "video-encoder", "video-decoder", "hardware-acceleration"]
readme = "README.md"

[dependencies]
tpt-webrtc-core = { workspace = true }
rav1e = { version = "0.7", default-features = false, features = ["threading"] }
thiserror = "2"
