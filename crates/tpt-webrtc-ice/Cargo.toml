[package]
name = "tpt-webrtc-ice"
description = "ICE agent (RFC 8445) with STUN (RFC 8489) and TURN (RFC 8656) client support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["network-programming", "asynchronous", "api-bindings"]
keywords = ["webrtc", "ice", "rfc8445", "stun", "rfc8489", "turn", "rfc8656", "nat-traversal", "connectivity"]
readme = "README.md"

[dependencies]
tpt-webrtc-core = { workspace = true }
tpt-webrtc-sdp = { workspace = true }
ring = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true }
thiserror = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
