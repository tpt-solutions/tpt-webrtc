[workspace]
resolver = "2"
members = [
    "crates/tpt-webrtc-core",
    "crates/tpt-webrtc-sdp",
    "crates/tpt-webrtc-ice",
    "crates/tpt-webrtc-dtls",
    "crates/tpt-webrtc-rtp",
    "crates/tpt-webrtc-sctp",
    "crates/tpt-webrtc-app",
    "crates/tpt-webrtc-media",
    "crates/tpt-webrtc-codecs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-webrtc"
rust-version = "1.75"

[workspace.dependencies]
tpt-webrtc-core = { path = "crates/tpt-webrtc-core", version = "0.1.0" }
tpt-webrtc-sdp = { path = "crates/tpt-webrtc-sdp", version = "0.1.0" }
tpt-webrtc-ice = { path = "crates/tpt-webrtc-ice", version = "0.1.0" }
tpt-webrtc-dtls = { path = "crates/tpt-webrtc-dtls", version = "0.1.0" }
tpt-webrtc-rtp = { path = "crates/tpt-webrtc-rtp", version = "0.1.0" }
tpt-webrtc-sctp = { path = "crates/tpt-webrtc-sctp", version = "0.1.0" }
tpt-webrtc-app = { path = "crates/tpt-webrtc-app", version = "0.1.0" }
tpt-webrtc-media = { path = "crates/tpt-webrtc-media", version = "0.1.0" }
tpt-webrtc-codecs = { path = "crates/tpt-webrtc-codecs", version = "0.1.0" }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
ring = "0.17"
getrandom = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
